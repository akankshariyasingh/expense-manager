<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expense Manager - Register</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.1);

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

            color: #4f46e5;

        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #333;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;

        }


        input:focus {

            outline: none;

            border-color: #4f46e5;

        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #4f46e5;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        button:hover {

            background: #4338ca;

        }


        button:disabled {

            background: #999;

            cursor: not-allowed;

        }


        #message {

            margin-top: 15px;

            text-align: center;

            line-height: 1.5;

        }


        .success {

            color: green;

        }


        .error {

            color: red;

        }


        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #666;

        }


        .login-link a {

            color: #4f46e5;

            font-weight: 600;

            text-decoration: none;

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>
            Expense Manager
        </h1>


        <p class="subtitle">
            Create your Expense Manager account
        </p>


        <form id="registerForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    minlength="3"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerButton"
            >
                Register
            </button>


        </form>


        <div id="message"></div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </div>



    <script>


        // ==================================================
        // PRODUCTION BACKEND URL
        // ==================================================

        const API_URL =
            "https://expense-manager-api-lpdf.onrender.com";


        // ==================================================
        // ELEMENTS
        // ==================================================

        const registerForm =
            document.getElementById(
                "registerForm"
            );


        const registerButton =
            document.getElementById(
                "registerButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        // ==================================================
        // REGISTER
        // ==================================================

        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // ------------------------------------------
                // GET FORM VALUES
                // ------------------------------------------

                const username =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                // ------------------------------------------
                // CLEAR OLD MESSAGE
                // ------------------------------------------

                message.textContent = "";

                message.className = "";


                // ------------------------------------------
                // DISABLE BUTTON
                // ------------------------------------------

                registerButton.disabled =
                    true;

                registerButton.textContent =
                    "Registering...";


                try {


                    // --------------------------------------
                    // CALL LIVE RENDER BACKEND
                    // --------------------------------------

                    const response =
                        await fetch(
                            `${API_URL}/users/`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                            }
                        );


                    // --------------------------------------
                    // READ RESPONSE
                    // --------------------------------------

                    const data =
                        await response.json();


                    console.log(
                        "Register status:",
                        response.status
                    );


                    console.log(
                        "Register response:",
                        data
                    );


                    // --------------------------------------
                    // SUCCESS
                    // --------------------------------------

                    if (response.ok) {

                        message.textContent =
                            "Registration successful!";

                        message.className =
                            "success";


                        registerForm.reset();


                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1000
                        );


                        return;

                    }


                    // --------------------------------------
                    // VALIDATION ERROR
                    // --------------------------------------

                    if (
                        response.status === 422
                    ) {


                        if (
                            Array.isArray(
                                data.detail
                            )
                        {


                            const errors =
                                data.detail.map(
                                    function(error) {

                                        const location =
                                            error.loc
                                                ? error.loc.join(
                                                    " → "
                                                )
                                                : "field";


                                        return (
                                            location +
                                            ": " +
                                            error.msg
                                        );

                                    }
                                );


                            message.innerHTML =
                                errors.join(
                                    "<br>"
                                );

                        }


                        else {

                            message.textContent =
                                "Invalid registration data.";

                        }


                        message.className =
                            "error";


                        return;

                    }


                    // --------------------------------------
                    // OTHER BACKEND ERROR
                    // --------------------------------------

                    message.textContent =
                        data.detail ||
                        data.message ||
                        "Registration failed.";


                    message.className =
                        "error";


                }


                catch (error) {


                    console.error(
                        "Registration error:",
                        error
                    );


                    message.textContent =
                        "Unable to connect to the backend.";


                    message.className =
                        "error";

                }


                // ------------------------------------------
                // ENABLE BUTTON AGAIN
                // ------------------------------------------

                registerButton.disabled =
                    false;


                registerButton.textContent =
                    "Register";

            }
        );


    </script>


</body>

</html>
